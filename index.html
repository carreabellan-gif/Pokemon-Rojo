<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokémon GBA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #display-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #emulator {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="display-container">
        <div id="emulator"></div>
    </div>

    <script type="text/javascript">
        // Configuración básica del emulador
        EJS_player = '#emulator';
        
        // Núcleo de la consola (gba para Game Boy Advance, gbc para Game Boy Color)
        EJS_core = 'gba'; 
        
        // Nombre o ruta exacta de tu archivo de ROM alojado en el mismo directorio
        EJS_gameUrl = 'pokemon.gba'; 
        
        // Configuración de interfaz
        EJS_gameName = 'Pokémon';
        EJS_color = '#e53935'; // Color de acento de la interfaz
        EJS_startOnLoaded = true; // Arranca el juego automáticamente tras la descarga
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/'; // Archivos del motor en CDN público
    </script>
    
    <!-- Carga del motor de emulación -->
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
